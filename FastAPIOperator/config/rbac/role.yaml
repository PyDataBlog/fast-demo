---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - dev.web.api
  resources:
  - fastapimanageds
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dev.web.api
  resources:
  - fastapimanageds/finalizers
  verbs:
  - update
- apiGroups:
  - dev.web.api
  resources:
  - fastapimanageds/status
  verbs:
  - get
  - patch
  - update
